<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Jocoqui · Caseta</title><style>body{font:16px system-ui;background:#0b1020;color:white;margin:0;padding:20px}main{max-width:760px;margin:auto}section,article{background:#18213a;padding:18px;border-radius:14px;margin:12px 0}input,select,button{padding:12px;border-radius:8px;border:1px solid #65708b;background:#0d172b;color:white;margin:4px}button{background:#315bc8;cursor:pointer}button:disabled{opacity:.5}.ok{color:#6be0a1}.bad{color:#ffad9f}small{color:#c2cbe0}#msg{white-space:pre-wrap}</style></head><body><main><h1>RADIO JOCOQUI</h1><p>Caseta · Lista oficial de acceso</p><section><input id="email" type="email" placeholder="Correo del equipo"><input id="password" type="password" placeholder="Contraseña"><button id="login">Entrar</button><button id="logout">Salir</button><p id="msg"></p></section><div id="app" hidden><section><select id="event"></select><input id="search" placeholder="Buscar nombre o folio"><button id="reload">Actualizar lista</button><p><small>Solo invitaciones con anticipo validado. El saldo debe liquidarse antes del ingreso.</small></p></section><div id="list"></div></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://grjqqhmzyfozrxrkvmyn.supabase.co','sb_publishable_6JiVK0CopQQiY-d2Ha0-mQ_Q6VuKGIe');const $=id=>document.getElementById(id),money=n=>Number(n).toLocaleString('es-MX',{style:'currency',currency:'MXN'});let data={events:[],invitations:[]};function msg(s){$('msg').textContent=s}async function rpc(f,a={}){const {data,error}=await sb.rpc(f,a);if(error)throw Error(error.message);return data}
async function refresh(){data=await rpc('rj_staff_list');$('app').hidden=false;const prev=$('event').value;$('event').replaceChildren();for(const e of data.events){const o=document.createElement('option');o.value=e.id;o.textContent=e.title+' · '+e.event_date;$('event').append(o)}if(data.events.some(e=>e.id===prev))$('event').value=prev;render()}
function render(){$('list').replaceChildren();const s=$('search').value.toLowerCase();for(const i of data.invitations.filter(i=>i.event_id===$('event').value&&(i.folio+' '+i.guest_name).toLowerCase().includes(s))){const e=data.events.find(x=>x.id===i.event_id);if(!e)continue;const due=Math.max(0,i.seats*Number(e.price_per_person)-Number(i.deposit_amount)-Number(i.final_payment_amount));const box=document.createElement('article');const title=document.createElement('h3');title.textContent=i.guest_name+' · '+i.folio;box.append(title);const info=document.createElement('p');info.textContent=i.seats+' lugar(es) · Saldo: '+money(due);box.append(info);const status=document.createElement('p');status.className=i.deposit_verified?'ok':'bad';status.textContent=i.checked_in_at?'INGRESO REGISTRADO':i.deposit_verified?'INVITACIÓN CONFIRMADA':'SIN ACCESO: ANTICIPO NO VALIDADO';box.append(status);const b=document.createElement('button');b.textContent=i.checked_in_at?'Ingreso ya registrado':'Liquidar saldo y registrar entrada';b.disabled=!i.deposit_verified||!!i.checked_in_at;b.onclick=async()=>{const value=prompt('Confirma el monto del saldo efectivamente cobrado (MXN):',String(due));if(value===null)return;if(!confirm('¿Identidad comprobada, saldo recibido y acceso autorizado?'))return;try{await rpc('rj_check_in',{p_invitation_id:i.id,p_final_amount:Number(value)});msg('Ingreso registrado.');await refresh()}catch(err){msg('Error: '+err.message)}};box.append(b);$('list').append(box)}}
$('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return msg(error.message);try{await refresh();msg('Acceso del equipo autorizado.')}catch(e){msg(e.message)}};$('logout').onclick=async()=>{await sb.auth.signOut();$('app').hidden=true;msg('Sesión cerrada')};$('reload').onclick=async()=>{try{await refresh()}catch(e){msg(e.message)}};$('event').onchange=render;$('search').oninput=render;const {data:{session}}=await sb.auth.getSession();if(session){try{await refresh();msg('Sesión activa.')}catch(e){msg(e.message)}}
</script></body></html>
