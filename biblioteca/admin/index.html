<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Jocoqui · Music Manager</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b111b;color:#f2f4f7;font:16px system-ui,Arial}main{max-width:900px;margin:36px auto;padding:20px}h1{font-size:clamp(28px,5vw,44px)}.card{background:#162132;border:1px solid #304258;border-radius:16px;padding:22px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:620px){.grid{grid-template-columns:1fr}}label{display:block;margin:10px 0 5px}input,button{font:inherit}input{width:100%;background:#0b111b;border:1px solid #4c6077;color:white;padding:12px;border-radius:9px}button{border:0;border-radius:9px;background:#e4b85c;color:#15191f;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:14px}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#36465b;color:white}.muted{color:#abb8c9}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #344357;padding:9px;overflow-wrap:anywhere}small{color:#b9c7d9}#status{white-space:pre-wrap}</style></head><body><main><p class="muted">RADIO JOCOQUI / MUSIC MANAGER</p><h1>Biblioteca musical</h1><p class="muted">Sube MP3 y envíalos a aprobación. Nada se publica automáticamente.</p><section id="login" class="card"><h2>Iniciar sesión</h2><form id="loginForm"><label>Correo electrónico<input id="email" type="email" required autocomplete="email"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="app" class="hidden"><div class="card"><p id="identity"></p><button id="logout" class="secondary">Cerrar sesión</button></div><section class="card"><h2>Subir MP3</h2><form id="uploadForm"><div class="grid"><label>Título<input id="title" maxlength="160" required></label><label>Artista / DJ<input id="artist" maxlength="160" required></label></div><label>Género<input id="genre" maxlength="100" placeholder="Downtempo, House, Ambient..."></label><label>Archivo MP3 (máximo 25 MB)<input id="audio" type="file" accept=".mp3,audio/mpeg" required></label><button id="uploadBtn">Enviar a revisión</button></form><p id="status" role="status"></p></section><section class="card"><h2 id="listTitle">Mis archivos</h2><div style="overflow:auto"><table><thead><tr><th>Título</th><th>Artista</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="tracks"></tbody></table></div></section></section><p class="muted"><small>Panel independiente de la página principal. La aprobación no publica automáticamente los archivos al público.</small></p></main><script type="module" src="app.js"></script></body></html>
