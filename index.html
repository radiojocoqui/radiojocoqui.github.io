
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Jocoqui — Universo Sonoro</title>

<style>
:root {
  color-scheme: dark;
  --text: #f5eee3;
  --muted: #b4c2d2;
  --gold: #f4c38d;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #02050c;
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button {
  font: inherit;
}

.universe {
  position: relative;
  isolation: isolate;
  min-height: 100svh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 105px 15px 40px;
  background:
    radial-gradient(ellipse at 50% 44%,
      #17283d 0%,
      #07111f 47%,
      #02050c 85%);
}

/* ESTRELLAS */

.stars {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    radial-gradient(1px 1px at 15% 20%, #fff, transparent),
    radial-gradient(2px 2px at 80% 15%, #fff, transparent),
    radial-gradient(1px 1px at 70% 80%, #fff, transparent),
    radial-gradient(2px 2px at 25% 75%, #fff, transparent),
    radial-gradient(1px 1px at 90% 55%, #fff, transparent),
    radial-gradient(1px 1px at 45% 10%, #fff, transparent);
  background-size: 230px 210px;
  opacity: .65;
}

/* IDENTIDAD */

.brand {
  position: absolute;
  top: 30px;
  left: 15px;
  right: 15px;
  text-align: center;
  z-index: 10;
}

.brand h1 {
  margin: 0;
  font-size: clamp(23px, 5vw, 42px);
  font-weight: 300;
  letter-spacing: .13em;
}

.brand p {
  margin-top: 12px;
  font-size: 10px;
  letter-spacing: .32em;
  color: #9eb9d0;
}

/* SISTEMA SOLAR */

.solar-system {
  position: relative;
  width: min(94vw, 680px);
  aspect-ratio: 1;
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.orbit {
  position: absolute;
  border: 1px solid rgba(150, 195, 230, .2);
  border-radius: 50%;
  pointer-events: none;
}

.orbit.one {
  width: 52%;
  height: 52%;
}

.orbit.two {
  width: 75%;
  height: 75%;
}

.orbit.three {
  width: 98%;
  height: 98%;
}

/* PLANETAS */

.planet {
  position: absolute;
  border-radius: 50%;
  z-index: 2;
  box-shadow: inset -5px -4px 8px rgba(0, 0, 0, .55);
}

.mercury {
  width: 12px;
  height: 12px;
  top: 24%;
  left: 27%;
  background: radial-gradient(circle at 30% 30%,
    #e1d5c6, #887d73 65%, #383b42);
}

.venus {
  width: 20px;
  height: 20px;
  top: 15%;
  right: 23%;
  background: radial-gradient(circle at 30% 30%,
    #ffe6b5, #bc845e 60%, #5b413b);
}

.earth {
  width: 24px;
  height: 24px;
  bottom: 16%;
  left: 15%;
  background:
    radial-gradient(ellipse at 38% 40%,
      #7baf85 0%, transparent 35%),
    radial-gradient(circle at 30% 30%,
      #b0efff, #2573b8 55%, #10284e);
  box-shadow:
    inset -5px -4px 8px rgba(0, 0, 0, .6),
    0 0 14px rgba(75, 155, 201, .45);
}

.mars {
  width: 17px;
  height: 17px;
  right: 10%;
  bottom: 32%;
  background: radial-gradient(circle at 30% 30%,
    #ffc0a0, #a53d30 65%, #472321);
}

.saturn {
  width: 28px;
  height: 28px;
  top: 48%;
  right: 1%;
  background: radial-gradient(circle at 30% 30%,
    #ffe7b0, #b58a52 65%, #4c4038);
}

.saturn::after {
  content: "";
  position: absolute;
  width: 44px;
  height: 13px;
  top: 7px;
  left: -10px;
  border: 2px solid rgba(233, 198, 140, .85);
  border-radius: 50%;
  transform: rotate(-25deg);
}

/* SOL CENTRAL */

.sun {
  position: relative;
  z-index: 5;
  width: min(48vw, 290px);
  aspect-ratio: 1;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;

  background: radial-gradient(circle,
    #fff4cf 0%,
    #ffbd78 20%,
    #f17b49 45%,
    #a83f3c 70%,
    transparent 100%);

  box-shadow:
    0 0 35px rgba(255, 164, 91, .8),
    0 0 90px rgba(255, 104, 70, .5),
    0 0 160px rgba(49, 174, 226, .2);
}

.sun::before {
  content: "";
  position: absolute;
  inset: -12px;
  border: 1px solid rgba(255, 201, 144, .35);
  border-radius: 50%;
  pointer-events: none;
}

/* REPRODUCTOR */

.player {
  position: relative;
  z-index: 6;
  width: 86%;
  aspect-ratio: 1;
  padding: 18px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  text-align: center;
  background: rgba(8, 17, 30, .91);
  border: 1px solid rgba(255, 202, 151, .65);
  box-shadow: 0 0 30px rgba(255, 143, 89, .4);
}

.audio-title {
  font-size: 12px;
  letter-spacing: .15em;
  color: #ffe2b8;
}

.audio-subtitle {
  font-size: 8px;
  letter-spacing: .13em;
  color: #b6c9db;
}

.track-title {
  width: 100%;
  font-size: 11px;
  line-height: 1.4;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.controls button {
  width: 34px;
  height: 34px;
  border: 1px solid rgba(255, 220, 177, .45);
  border-radius: 50%;
  background: rgba(255, 255, 255, .07);
  color: #fff;
  cursor: pointer;
  font-size: 15px;
}

.controls .play-button {
  width: 43px;
  height: 43px;
  background: rgba(244, 195, 141, .18);
  font-size: 19px;
}

.controls button:hover,
.controls button:focus-visible {
  background: rgba(244, 195, 141, .35);
}

.progress {
  width: 100%;
  accent-color: var(--gold);
  cursor: pointer;
}

.time-row {
  width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: #c6d1dc;
}

.status {
  font-size: 9px;
  color: #ffcc9a;
}

/* PLAYLIST */

.library {
  position: relative;
  z-index: 8;
  width: min(90vw, 470px);
  margin: 0 auto 30px;
  padding: 20px;
  border: 1px solid rgba(165, 184, 203, .25);
  border-radius: 18px;
  background: rgba(5, 12, 24, .85);
  backdrop-filter: blur(12px);
}

.library h2 {
  margin: 0 0 15px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: .22em;
  color: var(--gold);
}

.playlist {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.track {
  width: 100%;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  text-align: left;
  border: 1px solid rgba(165, 184, 203, .16);
  border-radius: 9px;
  background: rgba(255, 255, 255, .035);
  color: #dce4ed;
  cursor: pointer;
  font-size: 12px;
}

.track:hover,
.track:focus-visible {
  border-color: var(--gold);
}

.track.active {
  color: #ffdda9;
  border-color: rgba(244, 195, 141, .6);
  background: rgba(244, 195, 141, .1);
}

.track-number {
  color: #a9b8ca;
  font-size: 10px;
}

/* PIE */

.footer {
  position: relative;
  z-index: 10;
  margin-top: 10px;
  padding: 0 20px 25px;
  text-align: center;
  color: #a5b8cb;
  font-size: 10px;
  line-height: 1.8;
  letter-spacing: .2em;
}

/* ANIMACIONES */

@media (prefers-reduced-motion: no-preference) {
  .planet {
    animation: glow 4s ease-in-out infinite alternate;
  }

  .sun {
    animation: pulse 5s ease-in-out infinite alternate;
  }
}

@keyframes glow {
  from { filter: brightness(.85); }
  to { filter: brightness(1.3); }
}

@keyframes pulse {
  from { transform: scale(.985); }
  to { transform: scale(1.025); }
}

/* CELULARES */

@media (max-width: 480px) {
  .universe {
    padding-top: 125px;
    justify-content: flex-start;
  }

  .brand {
    top: 35px;
  }

  .brand h1 {
    font-size: 25px;
    letter-spacing: .1em;
  }

  .brand p {
    font-size: 8px;
    letter-spacing: .2em;
  }

  .solar-system {
    width: 96vw;
  }

  .sun {
    width: 56vw;
  }

  .player {
    width: 90%;
    padding: 10px;
    gap: 5px;
  }

  .audio-title {
    font-size: 9px;
  }

  .audio-subtitle {
    font-size: 7px;
  }

  .track-title {
    font-size: 9px;
  }

  .controls {
    gap: 8px;
  }

  .controls button {
    width: 30px;
    height: 30px;
    font-size: 13px;
  }

  .controls .play-button {
    width: 35px;
    height: 35px;
  }

  .library {
    width: 94vw;
  }

  .footer {
    font-size: 9px;
  }
}




/* AJUSTE DE TEXTOS RADIO JOCOQUI */

/* Mantener el lema debajo del logotipo */
.brand p {
  position: relative;
  margin: 8px auto 0;
  font-size: 10px;
  letter-spacing: 3px;
  line-height: 1.5;
  color: #a5b8cb;
}

/* Ordenar los textos dentro del Sol */
.player {
  gap: 10px;
}

.audio-title {
  font-size: 11px;
  line-height: 1.4;
  letter-spacing: 2px;
}

.audio-subtitle {
  font-size: 9px;
  line-height: 1.4;
  letter-spacing: 1px;
}

.track-title {
  font-size: 11px;
  line-height: 1.4;
}

/* AJUSTES PARA IPHONE */

@media (max-width: 480px) {

  /* Separar el lema del sistema solar */
  .brand p {
    margin-top: 8px;
    font-size: 8px;
    letter-spacing: 2px;
  }

  /* Colocar los textos del reproductor
     sin que se empalmen */
  .player {
    gap: 6px;
    padding: 12px;
  }

  .audio-title {
    font-size: 9px;
    line-height: 1.3;
  }

  .audio-subtitle {
    font-size: 7px;
    line-height: 1.3;
  }

  .track-title {
    font-size: 9px;
    line-height: 1.3;
  }
}

}

/* CORRECCION DEL LOGOTIPO RADIO JOCOQUI */

.brand {
  position: absolute !important;
  top: 20px !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  height: auto !important;
  margin: 0 !important;
  padding: 0 !important;
  transform: none !important;
  z-index: 20;
  text-align: center;
}

.brand-logo {
  display: block !important;
  width: min(85vw, 600px) !important;
  max-width: 100% !important;
  height: 110px !important;
  max-height: 110px !important;
  object-fit: contain !important;
  margin: 0 auto !important;
  transform: none !important;
}

.brand p {
  position: static !important;
  margin: 8px auto 0 !important;
  padding: 0 !important;
  transform: none !important;
  font-size: 9px !important;
  letter-spacing: 2px !important;
  line-height: 1.5 !important;
}

@media (max-width: 480px) {
  .brand {
    top: 20px !important;
  }

  .brand-logo {
    width: 85vw !important;
    height: 100px !important;
    max-height: 100px !important;
  }
}

/* RADIO JOCOQUI - BURBUJAS PLANETARIAS */

/* Volumen y reflejos */
.planet {
  border-radius: 50%;
  overflow: visible;
  box-shadow:
    inset -5px -5px 9px rgba(0,0,0,.65),
    inset 3px 3px 6px rgba(255,255,255,.22),
    0 0 15px rgba(180,210,255,.25);
}

/* Reflejo superficial */
.planet::before {
  content: "";
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  background: radial-gradient(
    ellipse at 28% 20%,
    rgba(255,255,255,.6),
    rgba(255,255,255,.12) 22%,
    transparent 55%
  );
  pointer-events: none;
}

/* MERCURIO */
.mercury {
  background: radial-gradient(
    circle at 28% 25%,
    #ddd3c7 0%,
    #9b9187 40%,
    #4b4745 75%,
    #17191e 100%
  );
}

/* VENUS */
.venus {
  background: radial-gradient(
    circle at 28% 25%,
    #fff3c9 0%,
    #e8b978 35%,
    #b16a46 70%,
    #3a2227 100%
  );
}

/* TIERRA */
.earth {
  background: radial-gradient(
    circle at 30% 25%,
    #e0faff 0%,
    #3ca9d4 22%,
    #267c9a 40%,
    #276b58 53%,
    #173b76 72%,
    #07152c 100%
  );
  box-shadow:
    inset -5px -5px 10px #07152c,
    0 0 13px rgba(74,178,255,.75),
    0 0 25px rgba(74,178,255,.25);
}

/* MARTE */
.mars {
  background: radial-gradient(
    circle at 28% 25%,
    #ffd0a3 0%,
    #c66d4d 35%,
    #853a31 70%,
    #291b22 100%
  );
}

/* SATURNO */
.saturn {
  background: radial-gradient(
    circle at 28% 25%,
    #fff1c5 0%,
    #d6b780 35%,
    #a07c59 70%,
    #30252b 100%
  );
}

/* Anillos */
.saturn::after {
  content: "";
  position: absolute;
  width: 160%;
  height: 42%;
  top: 29%;
  left: -30%;
  border: 3px solid rgba(239,210,160,.85);
  border-radius: 50%;
  transform: rotate(-25deg);
  box-shadow: 0 0 9px rgba(255,205,140,.3);
}

/* Movimiento atmosférico suave */
@media (prefers-reduced-motion: no-preference) {
  .planet {
    animation: planetBreath 7s ease-in-out infinite alternate;
  }
}

@keyframes planetBreath {
  from { filter: brightness(.9); }
  to { filter: brightness(1.2); }
}

/* LOGOTIPO RADIO JOCOQUI - MAS GRANDE */

.brand {
  position: absolute !important;
  top: 12px !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 20;
  text-align: center;
  transform: none !important;
}

.brand-logo {
  display: block !important;
  width: min(95vw, 780px) !important;
  max-width: 100% !important;
  height: 145px !important;
  max-height: 145px !important;
  object-fit: contain !important;
  margin: 0 auto !important;
  transform: none !important;
}

@media (max-width: 480px) {
  .brand-logo {
    width: 95vw !important;
    height: 130px !important;
    max-height: 130px !important;
  }
}

/* ==================================
   RADIO JOCOQUI - PLANETAS 3D
   ================================== */

/* Volumen tridimensional */
.planet {
  border-radius: 50%;
  position: absolute;
  overflow: visible;
  transform: translateZ(0);
  box-shadow:
    inset -8px -7px 12px rgba(0,0,0,.8),
    inset 4px 4px 7px rgba(255,255,255,.35),
    0 0 18px rgba(255,255,255,.12);
}

/* Reflejo esférico */
.planet::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(
      ellipse at 28% 22%,
      rgba(255,255,255,.65) 0%,
      rgba(255,255,255,.18) 20%,
      transparent 52%
    );
  pointer-events: none;
}

/* MERCURIO */
.mercury {
  width: 15px;
  height: 15px;
  background: radial-gradient(
    circle at 30% 25%,
    #e0d5c8 0%,
    #a39889 35%,
    #62594f 65%,
    #17191c 100%
  );
}

/* VENUS */
.venus {
  width: 28px;
  height: 28px;
  background: radial-gradient(
    circle at 30% 25%,
    #fff1c7 0%,
    #e8bc83 30%,
    #b7774e 65%,
    #35212a 100%
  );
}

/* TIERRA */
.earth {
  width: 34px;
  height: 34px;
  background:
    radial-gradient(
      ellipse at 42% 55%,
      rgba(46,125,90,.8) 0%,
      transparent 32%
    ),
    radial-gradient(
      circle at 30% 25%,
      #c7faff 0%,
      #46a7dc 24%,
      #195c9b 55%,
      #07172f 100%
    );

  box-shadow:
    inset -9px -8px 14px rgba(0,0,0,.85),
    0 0 16px rgba(57,166,255,.7),
    0 0 30px rgba(57,166,255,.25);
}

/* MARTE */
.mars {
  width: 25px;
  height: 25px;
  background: radial-gradient(
    circle at 30% 25%,
    #ffd1a5 0%,
    #d27b55 35%,
    #963e32 70%,
    #27191d 100%
  );
}

/* SATURNO */
.saturn {
  width: 39px;
  height: 39px;
  background: radial-gradient(
    circle at 30% 25%,
    #fff3d3 0%,
    #e1bd85 30%,
    #aa8055 65%,
    #30232a 100%
  );
}

/* Anillos tridimensionales */
.saturn::after {
  content: "";
  position: absolute;
  width: 160%;
  height: 42%;
  top: 29%;
  left: -30%;
  border: 4px solid rgba(240,211,158,.9);
  border-radius: 50%;
  transform: rotate(-25deg);
  box-shadow:
    0 0 8px rgba(255,216,159,.4),
    inset 0 0 6px rgba(255,216,159,.25);
}

/* Movimiento de luz */
@media (prefers-reduced-motion: no-preference) {
  .planet {
    animation: planetGlow3D 6s ease-in-out
      infinite alternate;
  }
}

@keyframes planetGlow3D {
  from {
    filter: brightness(.85);
  }
  to {
    filter: brightness(1.2);
  }
}

/* =====================================
   RADIO JOCOQUI - PLANETAS THREE.JS
   ===================================== */

/* Mantener posiciones originales */
.planet {
  overflow: visible !important;
  border-radius: 50%;
  background: transparent !important;
  box-shadow: none !important;
  filter: none !important;
  animation: none !important;
  isolation: isolate;
}

/* Desactivar reflejos CSS anteriores */
.planet::before,
.planet::after {
  content: none !important;
  display: none !important;
}

/* Lienzo tridimensional */
.planet canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
  border-radius: 50%;
  background: transparent;
  pointer-events: none;
}

/* Tamaños de las esferas */
.mercury {
  width: 18px !important;
  height: 18px !important;
}

.venus {
  width: 30px !important;
  height: 30px !important;
}

.earth {
  width: 40px !important;
  height: 40px !important;
}

.mars {
  width: 28px !important;
  height: 28px !important;
}

.saturn {
  width: 55px !important;
  height: 55px !important;
  overflow: visible !important;
}

.saturn canvas {
  border-radius: 0;
  overflow: visible;
}
/* SOL INTERACTIVO */

.sun {
  cursor: pointer;
  transition: transform 0.5s ease;
}

.sun:hover {
  transform: scale(1.035);
}

/* CONTROLES OCULTOS AL INICIO */

.player {
  opacity: 0;
  visibility: hidden;
  transform: scale(0.85);
  pointer-events: none;

  transition:
    opacity 0.6s ease,
    transform 0.6s ease,
    visibility 0.6s ease;
}

/* CONTROLES VISIBLES AL TOCAR EL SOL */

.sun.open .player {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
  pointer-events: auto;
}

/* MENSAJE INICIAL */

.sun-message {
  position: absolute;
  z-index: 7;
  text-align: center;
  color: #fff3d6;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.sun-message span {
  display: block;
  font-size: clamp(11px, 2vw, 17px);
  letter-spacing: 0.2em;
}

.sun-message small {
  display: block;
  margin-top: 12px;
  font-size: clamp(9px, 1.5vw, 12px);
  letter-spacing: 0.1em;
}

/* OCULTAR MENSAJE AL ABRIR */

.sun.open .sun-message {
  opacity: 0;
  visibility: hidden;
}
/* SOL Y REPRODUCTOR SIEMPRE VISIBLES */

.sun {
  cursor: default;
}

/* Mostrar controles permanentemente */

.sun .player,
.sun.open .player {
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
  transform: scale(1) !important;
}

/* Ocultar mensaje de tocar el sol */

.sun-message {
  display: none !important;
}

/* Mantener controles sobre el sol */

.player {
  position: relative;
  z-index: 10;
}</style>
</head>

<body>

<div class="universe">

  <div class="stars"></div>

  <header class="brand">
    <h1><img src="logo.PNG" alt="Radio Jocoqui" class="brand-logo"></h1>
    <p>MÚSICA · CULTURA · CONCIENCIA</p>
  </header>

  <main class="solar-system">

    <div class="orbit one"></div>
    <div class="orbit two"></div>
    <div class="orbit three"></div>

    <div class="planet mercury"></div>
    <div class="planet venus"></div>
    <div class="planet earth"></div>
    <div class="planet mars"></div>
    <div class="planet saturn"></div>

    <div class="sun-message">

        <div class="audio-title">RADIO JOCOQUI</div>

        <div class="track-title" id="trackTitle">

        </div>

        <div class="controls">
          <button id="previous" type="button"
            aria-label="Canción anterior">⏮</button>

          <button id="play" class="play-button"

          <button id="next" type="button"
            aria-label="Siguiente canción">⏭</button>

<script>
/*
  PLAYLIST RADIO JOCOQUI

  Los archivos deben estar en la misma carpeta
  que index.html dentro de GitHub.
*/


const tracks = [
  {
    title: "Fache De Con (Kesakocon)",
    file: "Fache De Con (Kesakocon).mp3"
  },
  {
    title: "Johannes Klingebiel - 808 Square",
    file: "Johannes Klingebiel - 808 Square.mp3"
  },
  {
    title: "My Kind of Woman",
    file: "My Kind of Woman.mp3"
  }
];


const audio = document.getElementById("audio");
const playButton = document.getElementById("play");
const previousButton = document.getElementById("previous");
const nextButton = document.getElementById("next");
const trackTitle = document.getElementById("trackTitle");
const playlist = document.getElementById("playlist");
const progress = document.getElementById("progress");
const currentTimeLabel = document.getElementById("currentTime");
const durationLabel = document.getElementById("duration");
const statusLabel = document.getElementById("status");

let currentTrack = 0;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const remaining = Math.floor(seconds % 60);

  return minutes + ":" + String(remaining).padStart(2, "0");
}

function renderPlaylist() {
  playlist.innerHTML = "";

  tracks.forEach((track, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = index === currentTrack
      ? "track active"
      : "track";

    const name = document.createElement("span");
    name.textContent = track.title;

    const number = document.createElement("span");
    number.className = "track-number";
    number.textContent = String(index + 1).padStart(2, "0");

    button.appendChild(name);
    button.appendChild(number);

    button.addEventListener("click", () => {
      loadTrack(index, true);
    });

    playlist.appendChild(button);
  });
}

function updatePlayButton() {
  const playing = !audio.paused && !audio.ended;

  playButton.textContent = playing ? "❚❚" : "▶";
  playButton.setAttribute(
    "aria-label",
    playing ? "Pausar" : "Reproducir"
  );
}

function loadTrack(index, autoplay = false) {
  currentTrack = (index + tracks.length) % tracks.length;

  audio.pause();
  audio.src = tracks[currentTrack].file;
  audio.load();

  trackTitle.textContent = tracks[currentTrack].title;
  progress.value = 0;
  currentTimeLabel.textContent = "0:00";
  durationLabel.textContent = "0:00";
  statusLabel.textContent = "Lista para reproducir";

  renderPlaylist();
  updatePlayButton();

  if (autoplay) {
    playCurrent();
  }
}

async function playCurrent() {
  try {
    statusLabel.textContent = "Cargando audio...";
    await audio.play();
    statusLabel.textContent = "Transmitiendo música";
  } catch (error) {
    statusLabel.textContent =
      "Toca Play para iniciar o verifica el archivo";
  }

  updatePlayButton();
}

playButton.addEventListener("click", () => {
  if (audio.paused) {
    playCurrent();
  } else {
    audio.pause();
  }
});

previousButton.addEventListener("click", () => {
  loadTrack(currentTrack - 1, true);
});

nextButton.addEventListener("click", () => {
  loadTrack(currentTrack + 1, true);
});

audio.addEventListener("play", () => {
  statusLabel.textContent = "Transmitiendo música";
  updatePlayButton();
});

audio.addEventListener("pause", updatePlayButton);

audio.addEventListener("loadedmetadata", () => {
  durationLabel.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  currentTimeLabel.textContent = formatTime(audio.currentTime);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    progress.value = (audio.currentTime / audio.duration) * 100;
  }
});

progress.addEventListener("input", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = (progress.value / 100) * audio.duration;
  }
});

audio.addEventListener("ended", () => {
  loadTrack(currentTrack + 1, true);
});

audio.addEventListener("error", () => {
  statusLabel.textContent =
    "No se pudo cargar el MP3";
  updatePlayButton();
});

loadTrack(0);
</script>


<!-- RADIO JOCOQUI: PLANETAS 3D -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script>

<script>
(function () {
  "use strict";

  if (!window.THREE) {
    console.warn("Three.js no pudo cargarse");
    return;
  }

  const THREE = window.THREE;

  const planets = [
    {
      selector: ".mercury",
      type: "rock",
      base: "#91877b",
      detail: "#4c4946",
      speed: 0.003
    },
    {
      selector: ".venus",
      type: "cloud",
      base: "#e5bc80",
      detail: "#b4774b",
      speed: 0.002
    },
    {
      selector: ".earth",
      type: "earth",
      base: "#176db4",
      detail: "#35865c",
      speed: 0.004
    },
    {
      selector: ".mars",
      type: "rock",
      base: "#b85d40",
      detail: "#77382c",
      speed: 0.003
    },
    {
      selector: ".saturn",
      type: "gas",
      base: "#dbc18b",
      detail: "#a27d59",
      speed: 0.002
    }
  ];

  const instances = [];

  // Texturas generadas sin archivos externos
  function makeTexture(planet) {
    const canvas = document.createElement("canvas");
    canvas.width = 512;
    canvas.height = 256;

    const ctx = canvas.getContext("2d");
    const w = canvas.width;
    const h = canvas.height;

    ctx.fillStyle = planet.base;
    ctx.fillRect(0, 0, w, h);

    const base = new THREE.Color(planet.base);
    const detail = new THREE.Color(planet.detail);

    // Patrón de superficie
    for (let i = 0; i < 1600; i++) {
      const x = Math.random() * w;
      const y = Math.random() * h;

      let size = Math.random() * 18 + 2;

      if (planet.type === "gas" ||
          planet.type === "cloud") {
        size = Math.random() * 35 + 10;
      }

      const mix = Math.random();
      const color = base.clone().lerp(detail, mix);

      ctx.fillStyle = "#" + color.getHexString();
      ctx.globalAlpha = 0.15 + Math.random() * 0.45;

      ctx.beginPath();

      if (planet.type === "gas" ||
          planet.type === "cloud") {
        ctx.ellipse(
          x, y,
          size * 2,
          size * 0.18,
          0, 0, Math.PI * 2
        );
      } else {
        ctx.arc(x, y, size, 0, Math.PI * 2);
      }

      ctx.fill();
    }

    ctx.globalAlpha = 1;

    if (planet.type === "earth") {
      // Bandas de nubes semitransparentes
      for (let i = 0; i < 55; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;

        ctx.fillStyle = "rgba(235,245,255,0.22)";
        ctx.beginPath();
        ctx.ellipse(
          x, y,
          15 + Math.random() * 30,
          2 + Math.random() * 5,
          Math.random() * 0.4,
          0, Math.PI * 2
        );
        ctx.fill();
      }
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
  }

  function createPlanet(config) {
    const element = document.querySelector(config.selector);
    if (!element) return;

    // Evitar crear dos renders sobre el mismo planeta
    if (element.querySelector("canvas")) return;

    let renderer;

    try {
      renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true,
        powerPreference: "low-power"
      });
    } catch (error) {
      console.warn("WebGL no disponible", error);
      return;
    }

    const width = element.clientWidth;
    const height = element.clientHeight;

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    renderer.setSize(width, height);
    renderer.setClearColor(0x000000, 0);

    element.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      40,
      width / height,
      0.1,
      100
    );

    camera.position.z = 3.8;

    const geometry = new THREE.SphereGeometry(
      1, 48, 32
    );

    const texture = makeTexture(config);

    const material = new THREE.MeshStandardMaterial({
      map: texture,
      roughness: 0.9,
      metalness: 0.0
    });

    const sphere = new THREE.Mesh(geometry, material);

    sphere.rotation.z = 0.15;
    scene.add(sphere);

    // Luz suave ambiental
    scene.add(
      new THREE.AmbientLight(0xffffff, 0.55)
    );

    // Luz principal del Sol
    const sunlight = new THREE.DirectionalLight(
      0xffe2bd, 2.4
    );

    sunlight.position.set(-3, 3, 5);
    scene.add(sunlight);

    // Saturno: anillos 3D
    if (config.type === "gas") {
      const ringGeometry = new THREE.RingGeometry(
        1.25, 1.9, 96
      );

      const ringMaterial = new THREE.MeshBasicMaterial({
        color: 0xd9bd88,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.78,
        depthWrite: false
      });

      const rings = new THREE.Mesh(
        ringGeometry,
        ringMaterial
      );

      rings.rotation.x = 1.1;
      rings.rotation.z = -0.35;

      sphere.add(rings);

      // Alejar cámara para mostrar los anillos
      camera.position.z = 5.5;
    }

    instances.push({
      renderer,
      scene,
      camera,
      sphere,
      speed: config.speed
    });
  }

  planets.forEach(createPlanet);

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let lastTime = 0;

  function animate(time) {
    requestAnimationFrame(animate);

    // Limitar actualización a ~30 FPS
    if (time - lastTime < 33) return;

    lastTime = time;

    instances.forEach(item => {
      if (!reducedMotion &&
          document.visibilityState === "visible") {
        item.sphere.rotation.y += item.speed;
      }

      item.renderer.render(
        item.scene,
        item.camera
      );
    });
  }

  if (instances.length) {
    requestAnimationFrame(animate);
  }
})();
</script>
<script>
const sun = document.getElementById("sun");

function toggleSunPlayer() {
  const isOpen = sun.classList.toggle("open");

  sun.setAttribute("aria-expanded", String(isOpen));
  sun.setAttribute(
    "aria-label",
    isOpen
      ? "Cerrar reproductor de Radio Jocoqui"
      : "Abrir reproductor de Radio Jocoqui"
  );
}

sun.addEventListener("click", (event) => {
  if (event.target.closest("button, input")) {
    return;
  }

  toggleSunPlayer();
});

sun.addEventListener("keydown", (event) => {
  if (event.target !== sun) return;

  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    toggleSunPlayer();
  }
});
</script></body>
