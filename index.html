<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Jocoqui — Universo Sonoro</title>

<style>
:root {
  color-scheme: dark;
  --text: #f5eee3;
  --gold: #f4c38d;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: #02050c;
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button { font: inherit; }

.universe {
  position: relative;
  isolation: isolate;
  min-height: 100svh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 185px 15px 40px;
  background:
    radial-gradient(ellipse at 50% 39%,
      #1b3049 0%,
      #091626 43%,
      #02050c 85%);
}

/* ESTRELLAS */

.stars {
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .75;
  background-image:
    radial-gradient(2px 2px at 15% 20%, #fff, transparent),
    radial-gradient(2px 2px at 80% 15%, #fff, transparent),
    radial-gradient(1px 1px at 70% 80%, #fff, transparent),
    radial-gradient(2px 2px at 25% 75%, #fff, transparent),
    radial-gradient(1px 1px at 90% 55%, #fff, transparent),
    radial-gradient(2px 2px at 45% 10%, #fff, transparent);
  background-size: 230px 210px;
}

/* LOGOTIPO */

.brand {
  position: absolute;
  top: 18px;
  left: 0;
  width: 100%;
  z-index: 30;
  text-align: center;
}

.brand h1 { margin: 0; }

.brand-logo {
  display: block;
  width: min(95vw, 780px);
  height: 145px;
  object-fit: contain;
  margin: 0 auto;
}

.brand p {
  margin: 7px auto 0;
  color: #b4c5d7;
  font-size: 10px;
  letter-spacing: .25em;
  line-height: 1.5;
}

/* SISTEMA SOLAR */

.solar-system {
  position: relative;
  width: min(94vw, 740px);
  aspect-ratio: 1;
  flex-shrink: 0;
  display: grid;
  place-items: center;
}

.orbit {
  position: absolute;
  border: 1px solid rgba(153, 196, 231, .22);
  border-radius: 50%;
  pointer-events: none;
}

.orbit.one { width: 52%; height: 52%; }
.orbit.two { width: 75%; height: 75%; }
.orbit.three { width: 98%; height: 98%; }

/* PLANETAS AL DOBLE */

.planet {
  position: absolute;
  z-index: 4;
  border-radius: 50%;
  overflow: visible;
  background: radial-gradient(circle at 28% 23%,
    #fff0d0, #8a7567 45%, #1b1720 100%);
  box-shadow:
    inset -9px -8px 14px rgba(0,0,0,.65),
    0 0 18px rgba(255,255,255,.1);
}

.planet canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
  background: transparent;
  pointer-events: none;
}

/* Posiciones originales */

.mercury {
  width: 36px;
  height: 36px;
  top: 24%;
  left: 27%;
}

.venus {
  width: 60px;
  height: 60px;
  top: 15%;
  right: 23%;
}

.earth {
  width: 80px;
  height: 80px;
  bottom: 16%;
  left: 15%;
  background: radial-gradient(circle at 30% 25%,
    #b3f7ff, #287db1 40%, #173b75 70%, #06101f);
}

.mars {
  width: 56px;
  height: 56px;
  right: 10%;
  bottom: 32%;
  background: radial-gradient(circle at 30% 25%,
    #ffd0a0, #b95b3e 45%, #401b1c);
}

.saturn {
  width: 110px;
  height: 110px;
  top: 48%;
  right: 1%;
  background: radial-gradient(circle at 30% 25%,
    #fff0c2, #bc9767 50%, #40312d);
}

/* Respaldo si no carga Three.js */

.saturn:not(:has(canvas))::after {
  content: "";
  position: absolute;
  width: 150%;
  height: 40%;
  top: 30%;
  left: -25%;
  border: 7px solid rgba(232,199,143,.85);
  border-radius: 50%;
  transform: rotate(-25deg);
}

/* SOL REALISTA */

.sun {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  width: min(58vw, 330px);
  aspect-ratio: 1;
  border-radius: 50%;
  display: grid;
  place-items: center;
  isolation: isolate;

  background:
    radial-gradient(circle at 34% 26%,
      rgba(255,252,210,.95) 0%,
      rgba(255,203,78,.9) 18%,
      rgba(255,112,20,.9) 45%,
      rgba(189,43,9,.95) 78%,
      #591507 100%);

  box-shadow:
    0 0 20px rgba(255,210,103,.95),
    0 0 60px rgba(255,124,28,.65),
    0 0 115px rgba(255,78,11,.35),
    0 0 190px rgba(255,75,0,.12);
}

/* Textura de plasma */

.sun-texture {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.sun-texture canvas {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
}

.sun::before {
  content: "";
  position: absolute;
  inset: -5%;
  border-radius: 50%;
  border: 2px solid rgba(255,196,80,.3);
  box-shadow:
    0 0 28px rgba(255,149,33,.55),
    inset 0 0 25px rgba(255,196,80,.25);
  pointer-events: none;
}

.sun::after {
  content: "";
  position: absolute;
  inset: -13%;
  border-radius: 50%;
  background: radial-gradient(circle,
    transparent 51%,
    rgba(255,141,23,.18) 63%,
    transparent 74%);
  pointer-events: none;
  z-index: -1;
}

/* REPRODUCTOR SIEMPRE VISIBLE */

.player {
  position: relative;
  z-index: 12;
  width: 86%;
  aspect-ratio: 1;
  padding: 18px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  text-align: center;
  background: rgba(8,15,27,.91);
  border: 1px solid rgba(255,214,157,.75);
  box-shadow:
    0 0 22px rgba(255,177,75,.5),
    inset 0 0 24px rgba(255,134,37,.1);
}

.audio-title {
  font-size: 12px;
  letter-spacing: .16em;
  color: #ffe0ad;
}

.audio-subtitle {
  font-size: 9px;
  letter-spacing: .12em;
  color: #b6c9db;
}

.track-title {
  width: 100%;
  font-size: 11px;
  line-height: 1.4;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
}

.controls button {
  width: 38px;
  height: 38px;
  border: 1px solid rgba(255,220,177,.55);
  border-radius: 50%;
  background: rgba(255,255,255,.09);
  color: white;
  cursor: pointer;
  font-size: 17px;
  touch-action: manipulation;
}

.controls .play-button {
  width: 49px;
  height: 49px;
  background: rgba(244,195,141,.22);
  font-size: 21px;
}

.controls button:focus-visible {
  outline: 2px solid #fff;
}

.progress {
  width: 100%;
  accent-color: var(--gold);
  cursor: pointer;
}

.time-row {
  width: 100%;
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #c6d1dc;
}

.status {
  font-size: 10px;
  color: #ffcc9a;
  line-height: 1.3;
}

/* ARCHIVO SONORO */

.library {
  position: relative;
  z-index: 20;
  width: min(92vw, 500px);
  margin: 45px auto 30px;
  padding: 22px;
  border: 1px solid rgba(165,184,203,.28);
  border-radius: 20px;
  background: rgba(5,12,24,.88);
  backdrop-filter: blur(12px);
}

.library h2 {
  margin: 0 0 17px;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: .22em;
  color: var(--gold);
}

.playlist {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.track {
  width: 100%;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  text-align: left;
  border: 1px solid rgba(165,184,203,.2);
  border-radius: 10px;
  background: rgba(255,255,255,.04);
  color: #dce4ed;
  cursor: pointer;
  font-size: 13px;
}

.track.active {
  color: #ffdda9;
  border-color: rgba(244,195,141,.7);
  background: rgba(244,195,141,.1);
}

.track-number {
  color: #a9b8ca;
  font-size: 11px;
}

.footer {
  position: relative;
  z-index: 20;
  padding: 10px 20px 30px;
  text-align: center;
  color: #a5b8cb;
  font-size: 10px;
  line-height: 1.8;
  letter-spacing: .17em;
}

/* ANIMACIÓN SUAVE */

@media (prefers-reduced-motion: no-preference) {
  .sun {
    animation: sunPulse 6s ease-in-out infinite alternate;
  }
}

@keyframes sunPulse {
  from {
    box-shadow:
      0 0 20px rgba(255,210,103,.9),
      0 0 60px rgba(255,124,28,.6),
      0 0 115px rgba(255,78,11,.3);
  }
  to {
    box-shadow:
      0 0 30px rgba(255,220,130,1),
      0 0 85px rgba(255,124,28,.8),
      0 0 150px rgba(255,78,11,.45);
  }
}

/* IPHONE */

@media (max-width: 480px) {
  .universe {
    padding-top: 175px;
  }

  .brand-logo {
    width: 95vw;
    height: 125px;
  }

  .brand p {
    font-size: 8px;
    letter-spacing: .16em;
  }

  .solar-system {
    width: 96vw;
  }

  .sun {
    width: 58vw;
  }

  .player {
    width: 90%;
    padding: 9px;
    gap: 5px;
  }

  .audio-title { font-size: 9px; }
  .audio-subtitle { font-size: 7px; }
  .track-title { font-size: 9px; }
  .status { font-size: 8px; }

  .controls { gap: 7px; }

  .controls button {
    width: 30px;
    height: 30px;
    font-size: 13px;
  }

  .controls .play-button {
    width: 37px;
    height: 37px;
    font-size: 17px;
  }

  .time-row { font-size: 9px; }

  .mercury { width: 36px; height: 36px; }
  .venus { width: 60px; height: 60px; }
  .earth { width: 80px; height: 80px; }
  .mars { width: 56px; height: 56px; }
  .saturn { width: 110px; height: 110px; }

  .library {
    width: 94vw;
    margin-top: 35px;
  }
}
/* QUITAR FONDO CIRCULAR DEL REPRODUCTOR */

.sun .player {
  background: transparent !important;
  box-shadow: none !important;
  border: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}</style>

<body>

<div class="universe">

  <div class="stars"></div>

  <header class="brand">
    <h1>
      <img
        src="logo.PNG"
        alt="Radio Jocoqui"
        class="brand-logo">
    </h1>
    <p>MÚSICA · CULTURA · CONCIENCIA</p>
  </header>

  <main class="solar-system">

    <div class="orbit one"></div>
    <div class="orbit two"></div>
    <div class="orbit three"></div>

    <div class="planet mercury"></div>
    <div class="planet venus"></div>
    <div class="planet earth"></div>
    <div class="planet mars"></div>
    <div class="planet saturn"></div>

    <div class="sun" id="sun">

      <div class="sun-texture" id="sunTexture"></div>

      <section class="player"
        aria-label="Reproductor musical">

        <div class="audio-title">
          RADIO JOCOQUI
        </div>

        <div class="audio-subtitle">
          UNIVERSO SONORO ∞
        </div>

        <div class="track-title" id="trackTitle">
          Canción 01
        </div>

        <div class="controls">

          <button id="previous"
            type="button"
            aria-label="Canción anterior">⏮</button>

          <button id="play"
            class="play-button"
            type="button"
            aria-label="Reproducir">▶</button>

          <button id="next"
            type="button"
            aria-label="Siguiente canción">⏭</button>

        </div>

        <input
          id="progress"
          class="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          aria-label="Progreso de la canción">

        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>

        <div class="status" id="status">
          Selecciona una canción
        </div>

        <audio id="audio" preload="metadata"></audio>

      </section>

    </div>

  </main>

  <section class="library"
    aria-label="Biblioteca musical">

    <h2>ARCHIVO SONORO</h2>

    <div id="playlist" class="playlist"></div>

  </section>

  <footer class="footer">
    UN UNIVERSO SONORO · MÚSICA PARA TODO EL MUNDO
    / PARA TODO MOMENTO
  </footer>

</div>

<script>
/* CANCIONES ORIGINALES */

const tracks = [
  {
    title: "Fache De Con (Kesakocon)",
    file: "Fache De Con (Kesakocon).mp3"
  },
  {
    title: "Johannes Klingebiel - 808 Square",
    file: "Johannes Klingebiel - 808 Square.mp3"
  },
  {
    title: "My Kind of Woman",
    file: "My Kind of Woman.mp3"
  }
];

const audio = document.getElementById("audio");
const playButton = document.getElementById("play");
const previousButton = document.getElementById("previous");
const nextButton = document.getElementById("next");
const trackTitle = document.getElementById("trackTitle");
const playlist = document.getElementById("playlist");
const progress = document.getElementById("progress");
const currentTimeLabel = document.getElementById("currentTime");
const durationLabel = document.getElementById("duration");
const statusLabel = document.getElementById("status");

let currentTrack = 0;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const remaining = Math.floor(seconds % 60);

  return minutes + ":" +
    String(remaining).padStart(2, "0");
}

function renderPlaylist() {
  playlist.innerHTML = "";

  tracks.forEach((track, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className =
      index === currentTrack ? "track active" : "track";

    const name = document.createElement("span");
    name.textContent = track.title;

    const number = document.createElement("span");
    number.className = "track-number";
    number.textContent =
      String(index + 1).padStart(2, "0");

    button.append(name, number);

    button.addEventListener("click", () => {
      loadTrack(index, true);
    });

    playlist.appendChild(button);
  });
}

function updatePlayButton() {
  const playing = !audio.paused && !audio.ended;

  playButton.textContent = playing ? "❚❚" : "▶";
  playButton.setAttribute(
    "aria-label",
    playing ? "Pausar" : "Reproducir"
  );
}

function loadTrack(index, autoplay = false) {
  currentTrack =
    (index + tracks.length) % tracks.length;

  audio.pause();
  audio.src = tracks[currentTrack].file;
  audio.load();

  trackTitle.textContent = tracks[currentTrack].title;
  progress.value = 0;
  currentTimeLabel.textContent = "0:00";
  durationLabel.textContent = "0:00";
  statusLabel.textContent = "Lista para reproducir";

  renderPlaylist();
  updatePlayButton();

  if (autoplay) playCurrent();
}

async function playCurrent() {
  try {
    statusLabel.textContent = "Cargando audio...";
    await audio.play();
    statusLabel.textContent = "Transmitiendo música";
  } catch (error) {
    statusLabel.textContent =
      "Toca Play o verifica el archivo MP3";
  }

  updatePlayButton();
}

playButton.addEventListener("click", () => {
  if (audio.paused) {
    playCurrent();
  } else {
    audio.pause();
  }
});

previousButton.addEventListener("click", () => {
  loadTrack(currentTrack - 1, true);
});

nextButton.addEventListener("click", () => {
  loadTrack(currentTrack + 1, true);
});

audio.addEventListener("play", () => {
  statusLabel.textContent = "Transmitiendo música";
  updatePlayButton();
});

audio.addEventListener("pause", updatePlayButton);

audio.addEventListener("loadedmetadata", () => {
  durationLabel.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  currentTimeLabel.textContent =
    formatTime(audio.currentTime);

  if (Number.isFinite(audio.duration) &&
      audio.duration > 0) {
    progress.value =
      (audio.currentTime / audio.duration) * 100;
  }
});

progress.addEventListener("input", () => {
  if (Number.isFinite(audio.duration) &&
      audio.duration > 0) {
    audio.currentTime =
      (progress.value / 100) * audio.duration;
  }
});

audio.addEventListener("ended", () => {
  loadTrack(currentTrack + 1, true);
});

audio.addEventListener("error", () => {
  statusLabel.textContent =
    "No se pudo cargar el MP3";
  updatePlayButton();
});

loadTrack(0);
</script>

<!-- SOL CON TEXTURA DE PLASMA -->

<script>
(function () {
  const holder = document.getElementById("sunTexture");
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  if (!ctx) return;

  canvas.width = 512;
  canvas.height = 512;
  holder.appendChild(canvas);

  const size = 512;
  const center = size / 2;
  const radius = 250;

  function noise(x, y, t) {
    return (
      Math.sin(x * 0.042 + t) *
      Math.cos(y * 0.055 - t * 0.6) +
      Math.sin((x + y) * 0.065 - t * 0.8) * 0.5 +
      Math.cos((x - y) * 0.09 + t * 1.3) * 0.25
    );
  }

  function drawSun(time) {
    const image = ctx.createImageData(size, size);
    const data = image.data;

    const t = time * 0.00013;

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const dx = x - center;
        const dy = y - center;
        const dist = Math.sqrt(dx * dx + dy * dy);

        const i = (y * size + x) * 4;

        if (dist > radius) {
          data[i + 3] = 0;
          continue;
        }

        const n = noise(x, y, t);
        const n2 = noise(x * 1.8, y * 1.8, -t * 1.5);

        const turbulence = n * 0.65 + n2 * 0.35;
        const edge = Math.pow(dist / radius, 1.7);

        let heat = 0.62 + turbulence * 0.15 - edge * 0.2;
        heat = Math.max(0, Math.min(1, heat));

        const spot = turbulence < -0.7 ? 0.5 : 1;

        data[i] = Math.min(255, 245 * spot);
        data[i + 1] = Math.min(
          255, (65 + heat * 165) * spot
        );
        data[i + 2] = Math.min(
          255, (5 + heat * 70) * spot
        );
        data[i + 3] = 225;
      }
    }

    ctx.putImageData(image, 0, 0);
  }

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let last = 0;

  function animate(time) {
    if (time - last >= 100) {
      last = time;
      if (document.visibilityState === "visible") {
        drawSun(time);
      }
    }

    requestAnimationFrame(animate);
  }

  drawSun(0);

  if (!reducedMotion) {
    requestAnimationFrame(animate);
  }
})();
</script>

<!-- PLANETAS 3D THREE.JS -->

<script type="module">
import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const planets = [
  {
    selector: ".mercury",
    type: "rock",
    base: "#91877b",
    detail: "#4c4946",
    speed: 0.003
  },
  {
    selector: ".venus",
    type: "cloud",
    base: "#e5bc80",
    detail: "#b4774b",
    speed: 0.002
  },
  {
    selector: ".earth",
    type: "earth",
    base: "#176db4",
    detail: "#35865c",
    speed: 0.004
  },
  {
    selector: ".mars",
    type: "rock",
    base: "#b85d40",
    detail: "#77382c",
    speed: 0.003
  },
  {
    selector: ".saturn",
    type: "gas",
    base: "#dbc18b",
    detail: "#a27d59",
    speed: 0.002
  }
];

const instances = [];

function makeTexture(planet) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 256;

  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = planet.base;
  ctx.fillRect(0, 0, w, h);

  const base = new THREE.Color(planet.base);
  const detail = new THREE.Color(planet.detail);

  for (let i = 0; i < 2200; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;

    let size = Math.random() * 18 + 2;

    if (planet.type === "gas" ||
        planet.type === "cloud") {
      size = Math.random() * 35 + 10;
    }

    const mix = Math.random();
    const color = base.clone().lerp(detail, mix);

    ctx.fillStyle = "#" + color.getHexString();
    ctx.globalAlpha = 0.15 + Math.random() * 0.45;

    ctx.beginPath();

    if (planet.type === "gas" ||
        planet.type === "cloud") {
      ctx.ellipse(
        x, y, size * 2, size * 0.18,
        0, 0, Math.PI * 2
      );
    } else {
      ctx.arc(x, y, size, 0, Math.PI * 2);
    }

    ctx.fill();
  }

  ctx.globalAlpha = 1;

  if (planet.type === "earth") {
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * w;
      const y = Math.random() * h;

      ctx.fillStyle = "rgba(235,245,255,0.22)";
      ctx.beginPath();
      ctx.ellipse(
        x, y,
        15 + Math.random() * 30,
        2 + Math.random() * 5,
        Math.random() * 0.4,
        0, Math.PI * 2
      );
      ctx.fill();
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function createPlanet(config) {
  const element = document.querySelector(config.selector);
  if (!element) return;

  let renderer;

  try {
    renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
      powerPreference: "low-power"
    });
  } catch (error) {
    console.warn("WebGL no disponible", error);
    return;
  }

  const width = element.clientWidth;
  const height = element.clientHeight;

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
  );

  renderer.setSize(width, height);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    40, width / height, 0.1, 100
  );

  camera.position.z = 3.8;

  const geometry = new THREE.SphereGeometry(
    1, 64, 48
  );

  const material = new THREE.MeshStandardMaterial({
    map: makeTexture(config),
    roughness: 0.9,
    metalness: 0
  });

  const sphere = new THREE.Mesh(geometry, material);
  sphere.rotation.z = 0.15;
  scene.add(sphere);

  scene.add(
    new THREE.AmbientLight(0xffffff, 0.65)
  );

  const sunlight = new THREE.DirectionalLight(
    0xffe2bd, 2.5
  );
  sunlight.position.set(-3, 3, 5);
  scene.add(sunlight);

  if (config.type === "gas") {
    const ringGeometry = new THREE.RingGeometry(
      1.25, 1.9, 96
    );

    const ringMaterial = new THREE.MeshBasicMaterial({
      color: 0xd9bd88,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.8,
      depthWrite: false
    });

    const rings = new THREE.Mesh(
      ringGeometry, ringMaterial
    );

    rings.rotation.x = 1.1;
    rings.rotation.z = -0.35;
    sphere.add(rings);

    camera.position.z = 5.5;
  }

  element.style.background = "transparent";
  element.style.boxShadow = "none";
  element.appendChild(renderer.domElement);

  instances.push({
    renderer, scene, camera, sphere,
    speed: config.speed
  });
}

planets.forEach(createPlanet);

const reducedMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

let lastTime = 0;

function animate(time) {
  requestAnimationFrame(animate);

  if (time - lastTime < 33) return;
  lastTime = time;

  if (document.visibilityState !== "visible") return;

  instances.forEach(item => {
    if (!reducedMotion) {
      item.sphere.rotation.y += item.speed;
    }

    item.renderer.render(item.scene, item.camera);
  });
}

if (instances.length) {
  requestAnimationFrame(animate);
}
</script>
