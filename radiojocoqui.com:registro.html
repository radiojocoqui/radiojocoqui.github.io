<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090f1d"><title>Comunidad | Radio Jocoqui</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4efe7;background:radial-gradient(ellipse at 52% 18%,#2a3448 0%,#10192a 39%,#080d18 80%);display:grid;place-items:center;padding:26px 16px}a{color:#e6c59d}main{width:min(100%,460px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-size:12px;letter-spacing:.16em}.top a{letter-spacing:0;text-decoration:none}.orb{width:74px;height:74px;margin:0 auto 15px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffe3a5,#d58d44 47%,#9b492e 75%,#492a36);box-shadow:0 0 48px #d38c4b50}.panel{padding:30px;border:1px solid #ffffff24;background:#101827d9;border-radius:22px;box-shadow:0 24px 80px #0007}h1{font-size:29px;text-align:center;letter-spacing:-.04em;margin:4px 0 8px}.sub{color:#abb5c6;text-align:center;line-height:1.55;font-size:14px;margin:0 0 24px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#080f1c;border:1px solid #ffffff22;border-radius:12px;padding:4px;margin-bottom:20px;gap:4px}.tabs button{background:transparent;color:#9eacbf;border:0;border-radius:9px;padding:12px;font-weight:700;cursor:pointer}.tabs button.active{background:#273449;color:#fff}label{display:block;margin:14px 0 6px;color:#d9dfeb;font-size:13px}input{width:100%;border:1px solid #ffffff35;background:#0a1220;border-radius:11px;padding:14px;color:white;font:inherit;font-size:15px;outline:none}input:focus{border-color:#e0a76c}button.submit{width:100%;background:#e5b47e;border:0;border-radius:12px;padding:14px;color:#17202b;font-weight:800;font-size:15px;margin-top:23px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.note{font-size:12px;line-height:1.6;color:#aeb9c9;text-align:center;margin-top:16px}.msg{margin-top:18px;border-radius:12px;padding:13px;font-size:14px;line-height:1.55;background:#26364b;display:none}.msg.error{background:#552b35;color:#ffe1e2}.msg.ok{background:#1d473d;color:#ddfff0}.account{text-align:center;display:none}.account h2{font-size:22px}.account p{color:#b9c5d5;line-height:1.6}.secondary{background:transparent;color:#e5b47e;border:1px solid #b58d65;border-radius:10px;padding:12px 20px;cursor:pointer;margin-top:8px}.foot{text-align:center;color:#8d9aab;font-size:12px;margin-top:22px}
</style></head><body><main><div class="top"><strong>RADIO JOCOQUI / COMUNIDAD</strong><a href="/">Volver al universo</a></div><div class="orb" aria-hidden="true"></div><section class="panel"><h1>Forma parte del universo</h1><p class="sub">Crea tu perfil para participar en la comunidad de Radio Jocoqui.</p><div id="auth"><div class="tabs"><button id="tab-register" type="button" class="active">Crear cuenta</button><button id="tab-login" type="button">Iniciar sesión</button></div><form id="form"><div id="name-field"><label for="name">Nombre visible</label><input id="name" maxlength="80" autocomplete="name" placeholder="¿Cómo te llamas?" required></div><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required placeholder="nombre@correo.com"><label for="password">Contraseña</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo 8 caracteres"><button class="submit" id="submit" type="submit">Crear mi cuenta</button></form><p class="note">Al registrarte, tu perfil queda Pendiente hasta que un administrador apruebe tu acceso. No compartas tu contraseña.</p></div><div id="account" class="account"><h2 id="greeting">Tu perfil</h2><p id="account-status"></p><button class="secondary" id="logout">Cerrar sesión</button></div><div id="msg" class="msg" role="status" aria-live="polite"></div></section><div class="foot">RADIO JOCOQUI · CASA JOCOQUI</div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const client=createClient('https://grjqqhmzyfozrxrkvmyn.supabase.co','sb_publishable_6JiVK0CopQQiY-d2Ha0-mQ_Q6VuKGIe',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let mode='register';const statuses={pending:'Pendiente de aprobación',basic:'Miembro de la comunidad',moderator:'Moderador',admin:'Administrador'};
function message(text,type=''){const el=$('msg');el.textContent=text;el.className='msg '+type;el.style.display='block'}function clearMessage(){$('msg').style.display='none'}
function setMode(next){mode=next;clearMessage();$('tab-register').classList.toggle('active',next==='register');$('tab-login').classList.toggle('active',next==='login');$('name-field').hidden=next==='login';$('name').required=next==='register';$('password').autocomplete=next==='register'?'new-password':'current-password';$('submit').textContent=next==='register'?'Crear mi cuenta':'Iniciar sesión'}
$('tab-register').onclick=()=>setMode('register');$('tab-login').onclick=()=>setMode('login');
async function render(){const {data:{user},error}=await client.auth.getUser();if(error&&!/session missing/i.test(error.message)){message('No se pudo comprobar la sesión: '+error.message,'error')} $('auth').style.display=user?'none':'block';$('account').style.display=user?'block':'none';if(!user)return;const {data:profile,error:profileError}=await client.from('profiles').select('display_name,role,points').eq('id',user.id).single();$('greeting').textContent='Hola, '+(profile?.display_name||user.email?.split('@')[0]||'');$('account-status').textContent=profileError?'No se pudo consultar el perfil. Inténtalo de nuevo.':'Estado: '+(statuses[profile?.role]||'Pendiente')+' · Puntos: '+(profile?.points??0)+(profile?.role==='pending'?'. Tu cuenta espera aprobación del administrador.':'.');}
$('form').onsubmit=async event=>{event.preventDefault();clearMessage();const btn=$('submit');btn.disabled=true;const email=$('email').value.trim(),password=$('password').value;try{if(mode==='register'){const name=$('name').value.trim();if(!name)throw Error('Escribe tu nombre.');const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:'https://radiojocoqui.com/registro.html'}});if(error)throw error;$('password').value='';if(data.session){await render();message('Tu cuenta fue creada. Tu acceso está pendiente de aprobación.','ok')}else message('Solicitud recibida. Revisa tu correo para confirmar la cuenta. Después vuelve a esta página e inicia sesión.','ok')}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;$('password').value='';await render();message('Sesión iniciada.','ok')}}catch(err){message('No se pudo completar la operación: '+err.message,'error')}finally{btn.disabled=false}};
$('logout').onclick=async()=>{const {error}=await client.auth.signOut();if(error)message(error.message,'error');else{clearMessage();await render()}};
await render();
</script></body></html>
