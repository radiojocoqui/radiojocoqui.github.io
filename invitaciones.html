<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Jocoqui · Invitaciones</title><style>body{font:16px system-ui;background:#0b1020;color:#f1f4ff;margin:0;padding:24px}main{max-width:1050px;margin:auto}section{background:#171f33;padding:20px;border-radius:14px;margin:16px 0}input,select,button{padding:11px;border-radius:8px;border:1px solid #65708b;background:#0e1629;color:white;margin:5px 4px 5px 0}button{cursor:pointer;background:#355bc5}button:disabled{opacity:.4}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #3b455c;text-align:left}small{color:#b5bfd4}.scroll{overflow:auto}#msg{white-space:pre-wrap}</style></head><body><main><h1>RADIO JOCOQUI</h1><p>Administración · Invitaciones y depósitos</p><section><h2>Acceso del equipo</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="login">Iniciar sesión</button><button id="logout">Salir</button><p id="msg" role="status"></p></section><div id="app" hidden><section><h2>Crear evento</h2><form id="eventForm"><input name="title" required placeholder="Nombre del evento"><input name="date" type="date" required><input name="capacity" type="number" min="1" required placeholder="Cupo"><input name="price" type="number" min="0" step="0.01" required placeholder="Precio por persona MXN"><button>Crear</button></form></section><section><h2>Registrar invitación</h2><form id="inviteForm"><select name="event" id="eventSelect" required></select><input name="name" required placeholder="Nombre completo"><input name="contact" placeholder="Teléfono / contacto"><input name="seats" type="number" min="1" value="1" required><button>Crear invitación</button></form><small>Crear invitación NO autoriza acceso. El cupo se reserva solo al validar el anticipo.</small></section><section><h2>Invitaciones y pagos</h2><label>Evento: <select id="filter"></select></label><div class="scroll"><table><thead><tr><th>Folio / Invitado</th><th>Lugares</th><th>Total</th><th>Anticipo</th><th>Saldo</th><th>Estado / Acción</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://grjqqhmzyfozrxrkvmyn.supabase.co','sb_publishable_6JiVK0CopQQiY-d2Ha0-mQ_Q6VuKGIe');
const $=id=>document.getElementById(id), money=n=>Number(n).toLocaleString('es-MX',{style:'currency',currency:'MXN'});let data={events:[],invitations:[]};
function msg(s){$('msg').textContent=s}async function rpc(fn,args={}){const {data,error}=await sb.rpc(fn,args);if(error)throw Error(error.message);return data}
async function refresh(){data=await rpc('rj_staff_list');$('app').hidden=false;const opts=data.events.map(e=>`<option value="${e.id}">${escapeHtml(e.title)} · ${e.event_date}</option>`).join('');$('eventSelect').innerHTML=opts;$('filter').innerHTML='<option value="">Todos los eventos</option>'+opts;render()}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const filtered=data.invitations.filter(i=>!$('filter').value||i.event_id===$('filter').value);$('rows').replaceChildren();for(const i of filtered){const e=data.events.find(x=>x.id===i.event_id);if(!e)continue;const total=Number(e.price_per_person)*i.seats, due=Math.max(0,total-Number(i.deposit_amount)-Number(i.final_payment_amount));const tr=document.createElement('tr');for(const value of [i.folio+' · '+i.guest_name,i.seats,money(total),money(i.deposit_amount),money(due)]){const td=document.createElement('td');td.textContent=value;tr.append(td)}const td=document.createElement('td');td.textContent=i.checked_in_at?'Ingresó':i.deposit_verified?'Confirmada':'Pendiente';if(!i.deposit_verified){const b=document.createElement('button');b.textContent='Validar 50%';b.onclick=async()=>{const amount=prompt('Monto recibido y verificado en banco (MXN):',String(total/2));if(amount===null)return;if(!confirm('¿Verificaste que el depósito realmente llegó?'))return;await act('rj_confirm_deposit',{p_invitation_id:i.id,p_amount:Number(amount)})};td.append(b)}tr.append(td);$('rows').append(tr)}}
async function act(fn,args){try{await rpc(fn,args);msg('Operación guardada.');await refresh()}catch(e){msg('Error: '+e.message)}}
$('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return msg(error.message);try{await refresh();msg('Sesión iniciada.')}catch(e){msg(e.message)}};
$('logout').onclick=async()=>{await sb.auth.signOut();$('app').hidden=true;msg('Sesión cerrada')};
$('eventForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);await act('rj_create_event',{p_title:f.get('title'),p_date:f.get('date'),p_capacity:Number(f.get('capacity')),p_price:Number(f.get('price'))})};
$('inviteForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);await act('rj_add_invitation',{p_event_id:f.get('event'),p_guest_name:f.get('name'),p_guest_contact:f.get('contact'),p_seats:Number(f.get('seats'))})};$('filter').onchange=render;
const {data:{session}}=await sb.auth.getSession();if(session){try{await refresh();msg('Sesión activa.')}catch(e){msg(e.message)}}
</script></body></html>
